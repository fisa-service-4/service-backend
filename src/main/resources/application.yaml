server:
  port: 8080

spring:
  application:
    name: service-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/finance
    username: admin
    password: 1234

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql

  jpa:
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

log:
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_log
    username: admin
    password: 1234

analytics:
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_analytics
    username: admin
    password: 1234

jwt:
  secret: local-dev-secret-key-must-be-at-least-256-bits-long-for-hs256
  access-token-expiration: 3600000    # 1시간 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

firebase:
  credential-path: classpath:woorifis-service-firebase-adminsdk-fbsvc-bf3b482f03.json

mydata:
  server:
    url: http://localhost:8084/mydata/v1

transaction-server:
  url: http://transaction-server:8083


ai:
  server:
    url: http://localhost:8000/api/v1/ai
