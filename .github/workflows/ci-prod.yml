name: CI-Prod

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  packages: write

env:
  SERVICE_NAME: service-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (prod tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:prod

  deploy-app-2a:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem

      - name: Deploy to APP-2A
        run: |
          ssh -i ~/.ssh/aws_key.pem \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/aws_key.pem -W %h:%p -o StrictHostKeyChecking=no ${{ secrets.AWS_BASTION_USER }}@${{ secrets.AWS_BASTION_HOST }}" \
            ubuntu@172.16.10.10 << 'EOF'
          cd ~/infra && git pull
          IMAGE_TAG=prod docker compose -f docker-compose-prod-app.yml pull ${{ env.SERVICE_NAME }}
          IMAGE_TAG=prod docker compose -f docker-compose-prod-app.yml up -d --no-deps ${{ env.SERVICE_NAME }}
          docker image prune -f
          EOF

